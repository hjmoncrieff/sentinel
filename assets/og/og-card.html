<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>SENTINEL social card source</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&family=Playfair+Display:wght@900&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f4efe6;font-family:'DM Sans',sans-serif;color:#191712;position:relative}
.rule{position:absolute;left:0;right:0;top:0;height:10px;background:#263221}
.wrap{position:absolute;left:84px;top:96px;width:760px}
.kicker{white-space:nowrap;font:500 17px/1.4 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#a86131}
.title{font:900 118px/1 'Playfair Display',serif;letter-spacing:.01em;margin:30px 0 26px}
.title em{color:#a86131;font-style:normal}
.sub{font-size:32px;line-height:1.3;color:#474137;max-width:620px}
.chips{position:absolute;left:84px;bottom:74px;display:flex;gap:14px}
.chip{font:500 17px/1 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#263221;border:1.5px solid #a9987c;border-radius:999px;padding:12px 20px}
.mark{position:absolute;right:84px;top:150px;width:270px;height:270px}
.url{position:absolute;right:92px;bottom:84px;font:400 18px/1 'DM Mono',monospace;color:#7b7366}
</style></head><body>
<div class="rule"></div>
<div class="wrap">
  <div class="kicker">Regional Monitor · Latin America &amp; the Caribbean</div>
  <div class="title">SENTINEL<em>.</em></div>
  <div class="sub">Civil-military relations, political risk, and security events</div>
</div>
<svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <circle cx="32" cy="32" r="31" fill="none" stroke="#cabfaa" stroke-width=".6"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#cabfaa" stroke-width=".6"/>
  <rect x="11" y="11" width="42" height="42" rx="10" fill="#263221"/>
  <circle cx="32" cy="32" r="11.2" fill="none" stroke="#f4efe6" stroke-width="3.3"/>
  <circle cx="32" cy="32" r="4.3" fill="#a86131"/>
</svg>
<div class="chips"><span class="chip">25 countries</span><span class="chip">Live event feed</span><span class="chip">Country dossiers</span></div>
<div class="url">hjmoncrieff.github.io/sentinel</div>
</body></html>
