name: Daily SENTINEL Pipeline

on:
  schedule:
    # 07:00 UTC = 3 AM EDT / 2 AM EST. GitHub often starts scheduled runs hours
    # late, so there is deliberately no start-time gate: a late run still runs.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # A normal run takes about 7 minutes; a catch-up run after missed nights is longer.
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Preflight secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ACLED_API_KEY: ${{ secrets.ACLED_API_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
        run: |
          echo "## SENTINEL pipeline preflight" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "- ANTHROPIC_API_KEY: present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ANTHROPIC_API_KEY: missing" >> "$GITHUB_STEP_SUMMARY"
            echo "ANTHROPIC_API_KEY is required for scripts/run_pipeline.py"
            exit 1
          fi
          if [ -n "$NEWSAPI_KEY" ]; then
            echo "- NEWSAPI_KEY: present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- NEWSAPI_KEY: missing (pipeline will skip NewsAPI)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ACLED_API_KEY" ] && [ -n "$ACLED_EMAIL" ]; then
            echo "- ACLED credentials: present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ACLED credentials: incomplete (pipeline will skip ACLED)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run pipeline
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
          ACLED_API_KEY:      ${{ secrets.ACLED_API_KEY }}
          ACLED_EMAIL:        ${{ secrets.ACLED_EMAIL }}
          # Optional — weekly email digest
          DIGEST_TO:          ${{ secrets.DIGEST_TO }}
          DIGEST_FROM:        ${{ secrets.DIGEST_FROM }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
        run: |
          # Exit 3 = degraded: the model API refused (e.g. no credit), so the run published the collected
          # headlines as "not yet coded" (data/published/pending_headlines.json) and coded nothing. The
          # data is still committed and deployed; the failure alert below is raised all the same.
          set +e
          python scripts/run_pipeline.py
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            echo "## ⚠️ Degraded run: model API unavailable; uncoded headlines published, nothing coded" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Model API unavailable; published uncoded headlines only"
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi
          echo "## Ingest result" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("data/events.json")
          if not path.exists():
              print("- data/events.json missing after pipeline run")
          else:
              payload = json.loads(path.read_text(encoding="utf-8"))
              events = payload.get("events", [])
              latest = max((event.get("date") or "" for event in events), default="unknown")
              print(f"- Stored events: {len(events)}")
              print(f"- Latest event date: {latest}")
          PY

      - name: Rebuild Downstream Layers
        if: steps.run.outputs.degraded != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sonnet council synthesis is opt-in: council_analyses.json is not kept
          # between runs, so each run would re-synthesise every high/medium event.
          # Set the repo variable RUN_COUNCIL_SYNTHESIS=true once the cost is approved.
          RUN_COUNCIL_SYNTHESIS: ${{ vars.RUN_COUNCIL_SYNTHESIS }}
          # Read-only use: restore saved synthesis from the council_analyses snapshot.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/rebuild_downstream.py
          if [ "$RUN_COUNCIL_SYNTHESIS" != "true" ]; then
            echo "- Council synthesis skipped (RUN_COUNCIL_SYNTHESIS not true)" >> "$GITHUB_STEP_SUMMARY"
          fi
          python - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path
          STALE_DAYS = 3
          lines = ["## Published output"]
          path = Path("data/published/events_public.json")
          if not path.exists():
              lines.append("- data/published/events_public.json missing after downstream rebuild")
              print("::error::data/published/events_public.json missing after downstream rebuild")
          else:
              events = json.loads(path.read_text(encoding="utf-8")).get("events", [])
              latest = max((e.get("event_date") or "" for e in events), default="")
              lines += [f"- Published events: {len(events)}", f"- Latest published date: {latest or 'unknown'}"]
              age = (date.today() - date.fromisoformat(latest)).days if latest else None
              if age is None or age > STALE_DAYS:
                  msg = f"Newest published event is {age if age is not None else '?'} days old (threshold {STALE_DAYS})."
                  lines.append(f"- ⚠️ {msg}")
                  print(f"::warning::{msg}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      # Country officeholders, commanders and elections, researched with web search.
      # Runs for countries whose recent events signal a change, plus the entries not
      # checked in 30 days; at most three a night (about $0.25 each). Findings are
      # stored as proposals: the site keeps the current values, marked "Under review",
      # until an analyst approves them. A failure here must not block the data refresh.
      - name: Refresh country reference
        if: steps.run.outputs.degraded != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/reference/refresh_country_reference.py --triggered --stale-days 30 --max-countries 3

      - name: Commit updated data
        run: |
          git config user.name  "sentinel-bot"
          git config user.email "sentinel-bot@users.noreply.github.com"
          git add data/ apps/public-site/reference/
          git diff --staged --quiet || git commit -m "chore: daily pipeline refresh $(date -u +'%Y-%m-%d') [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Close failure alert
        if: success() && steps.run.outputs.degraded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label pipeline-failure --state open --search 'in:title "Daily SENTINEL Pipeline is failing"' --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Recovered: run succeeded on $(date -u +'%Y-%m-%d %H:%M UTC'): $RUN_URL"
          fi

      - name: Alert on failure
        if: failure() || steps.run.outputs.degraded == 'true'
        env:
          DEGRADED: ${{ steps.run.outputs.degraded }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One open issue per workflow; later failures comment on it instead of piling up.
          label="pipeline-failure"
          title="Daily SENTINEL Pipeline is failing"
          gh label create "$label" --color B83232 --description "Automated workflow failure alert" --force
          if [ "$DEGRADED" = "true" ]; then
            body="Degraded run on $(date -u +'%Y-%m-%d %H:%M UTC'): the model API was unavailable (check the Anthropic credit balance and key). Uncoded headlines were published; nothing was coded. $RUN_URL"
          else
            body="Run failed on $(date -u +'%Y-%m-%d %H:%M UTC'): $RUN_URL"
          fi
          existing=$(gh issue list --label "$label" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
