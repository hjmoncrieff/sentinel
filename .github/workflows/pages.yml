name: Deploy Site

# Publishes the static public site plus the built React analyst console to
# GitHub Pages. Bot data commits use [skip ci], which suppresses push triggers,
# so the site is also redeployed after each successful data workflow.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily SENTINEL Pipeline", "Supabase Sync"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel. The pipeline and Supabase Sync both trigger a deploy
# moments apart; with cancel-in-progress, a triggered run whose jobs were then
# skipped (sync failed) still cancelled the real deploy (2026-10-01). Every
# deploy checks out the latest main, so a replaced pending run loses nothing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install console dependencies
        run: pnpm install --frozen-lockfile

      - name: Build analyst console
        env:
          CONSOLE_BASE: /sentinel/
          CONSOLE_DEPLOY: '1'
        run: pnpm analyst-console:build

      - name: Assemble site
        run: |
          # The public site is the root of the deploy. It is built first, into an empty folder.
          node apps/public-site/build.mjs --out _site --base /sentinel/ --production
          # Then only what the site and the analyst console load from the repo: the static pages and
          # their assets, crawler files, the published layer and actor registry the console reads, and
          # the console itself (the built app replaces the Vite source entry).
          rsync -a assets 404.html privacy.html terms.html thank-you.html robots.txt sitemap.xml site.webmanifest _site/
          mkdir -p _site/data _site/config
          rsync -a data/published _site/data/
          rsync -a config/actors _site/config/
          rsync -a apps/analyst-console _site/apps/ --exclude src
          rsync -a dist/apps/analyst-console/ _site/apps/analyst-console/
          # Defence in depth: never publish private workflow layers.
          rm -rf _site/data/review _site/data/gold _site/data/modeling _site/data/staging
          test -f _site/index.html && grep -q fp-dateline _site/index.html && test -f _site/apps/analyst-console/index.html && test -f _site/countries/col/index.html && test -f _site/organized-crime/index.html && test -f _site/us-security/index.html && test -f _site/feed/index.html && test -f _site/explore/index.html && test -f _site/about/index.html && test -f _site/data/feed.json && test -f _site/privacy.html && test -f _site/assets/icons/favicon.svg
          echo "Site files: $(find _site -type f | wc -l), $(du -sh _site | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
