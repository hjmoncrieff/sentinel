name: Supabase Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily SENTINEL Pipeline"]
    types:
      - completed

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Preflight Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "## Supabase sync preflight" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL is required."
            exit 1
          fi
          if [ -n "$SUPABASE_SECRET_KEY" ]; then
            echo "- Using SUPABASE_SECRET_KEY" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "- Using SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A Supabase elevated key is required."
            exit 1
          fi

      - name: Run Supabase cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/sync/run_supabase_cycle.py

      - name: Commit refreshed outputs
        run: |
          git config user.name "sentinel-bot"
          git config user.email "sentinel-bot@users.noreply.github.com"
          git add config/actors/actor_registry.json data/published/ data/canonical/events_actor_coded.json
          git diff --staged --quiet || git commit -m "chore: sync Supabase workflow outputs $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One open issue per workflow; later failures comment on it instead of piling up.
          label="pipeline-failure"
          title="Supabase Sync is failing"
          gh label create "$label" --color B83232 --description "Automated workflow failure alert" --force
          body="Run failed on $(date -u +'%Y-%m-%d %H:%M UTC'): $RUN_URL"
          existing=$(gh issue list --label "$label" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
