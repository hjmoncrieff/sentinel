[project]
name = "sentinel"
version = "0.1.0"
description = "Civil-military relations monitoring platform for Latin America and the Caribbean."
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  "archive",
  "data",
  "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["scripts"]
exclude = [
  "**/__pycache__",
  "archive",
  "data",
  "node_modules",
]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = ["."]
